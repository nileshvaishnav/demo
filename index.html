  --navy:#9fb7d6; --navy-ink:#12171d; --side:#0e1318; --side-ink:#d9dee6; --side-muted:#7f8b9a;
  --good:#6cc28e; --good-soft:#1d3527; --warn:#e7a35c; --warn-soft:#3a2a18; --bad:#ec8a8a; --bad-soft:#3d2222; --info:#8ab8e0; --info-soft:#1c2c3c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);margin:0}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--side);color:var(--side-ink);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}

.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--side-muted)}

.seg{display:flex}

.seg button.on{background:var(--accent);color:#1c1405;border-color:var(--accent)}
.demo-note{background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;padding:6px 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 90px)}
.side{background:var(--side);padding:12px 8px;display:flex;flex-direction:column;gap:2px}

.side button:focus-visible{outline:2px solid var(--accent)}

.side .who b{color:var(--side-ink);display:block;font-size:13px}
main{padding:20px 22px 60px;min-width:0;display:grid;gap:14px;align-content:start}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:2px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}

tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}

.pill{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 8px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent-ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}

input[type=text],input[type=number],input[type=search],input[type=tel],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;min-width:0}

.qin{display:flex;gap:4px;flex-wrap:nowrap;align-items:center}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 5px 5px 0;font-size:13px}

.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--good)}

.pick{display:grid;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:5px;background:var(--bg)}

.steps{display:flex;gap:0;flex-wrap:wrap}

.lock{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:5px}

.scrim{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:16px;z-index:40}

.burger{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:5px;color:var(--side-ink)}
